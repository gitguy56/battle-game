<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit 2-1 Bodycam</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  #game { display: block; width: 100%; height: 100%; cursor: crosshair; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10;
         transition: opacity .3s;
         text-transform: uppercase; letter-spacing: 0.08em; }
  #bc-frame { position: absolute; inset: 0; }
  #bc-frame > div { position: absolute; font-size: 13px; color: #e8e8e8;
    text-shadow: 0 1px 3px #000, 0 0 10px rgba(0,0,0,.8); opacity: .88; }
  .bc-tl { top: 18px; left: 22px; }
  .bc-tr { top: 18px; right: 22px; }
  .bc-bl { bottom: 18px; left: 22px; }
  .bc-br { bottom: 18px; right: 22px; font-size: 12px; opacity: .9 !important;
    display: flex; align-items: baseline; gap: 9px; }
  #bc-weapon b { font-weight: 600; letter-spacing: .14em; }
  #bc-weapon .ammo { font-variant-numeric: tabular-nums; font-size: 17px; letter-spacing: .02em; }
  #bc-weapon .ammo i { font-style: normal; font-size: 11px; opacity: .5; }
  #bc-weapon .rl { font-size: 11px; opacity: .6; letter-spacing: .12em; }
  #bc-prompt { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: .1em; color: #fff; opacity: 0; transition: opacity .18s;
    text-shadow: 0 2px 6px #000; white-space: nowrap; }
  #bc-prompt b { display: inline-block; border: 1px solid rgba(255,255,255,.5);
    padding: 1px 6px; margin-right: 6px; font-weight: 600; }
  #bc-rec { color: #ff3b30; font-size: 15px; }
  .bc-cell { display: inline-block; width: 22px; height: 11px; border: 1.5px solid #e8e8e8;
    border-radius: 2px; position: relative; vertical-align: -1px; margin-left: 3px; }
  .bc-cell::before { content: ""; position: absolute; inset: 1.5px; right: 40%; background: #e8e8e8; }
  .bc-cell::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px;
    height: 5px; background: #e8e8e8; }

  /* Crosshair. The centre of the screen is exactly where the shot goes, and
     the gap opens up as your spread widens. */
  #bc-cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    --gap: 4px; transition: opacity .2s; }
  #bc-cross i { position: absolute; background: #fff; opacity: .92;
    box-shadow: 0 0 2px rgba(0,0,0,.9); transition: transform .06s linear; }
  .ch-u, .ch-d { width: 1.5px; height: 6px; left: -0.75px; }
  .ch-l, .ch-r { width: 6px; height: 1.5px; top: -0.75px; }
  .ch-u { bottom: var(--gap); } .ch-d { top: var(--gap); }
  .ch-l { right: var(--gap); }  .ch-r { left: var(--gap); }
  #bc-hit { position: absolute; left: -7px; top: -9px; width: 14px;
    font-size: 15px; line-height: 1; text-align: center; opacity: 0;
    transition: opacity .18s; font-weight: 700; }
  #bc-hit::before { content: "\00d7"; }

  /* Direction the last shot came from */
  #bc-dmg { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
  #bc-dmg i { position: absolute; left: -46px; top: -150px; width: 92px; height: 22px;
    background: radial-gradient(60% 100% at 50% 100%, rgba(255,60,40,.85), rgba(255,60,40,0));
    transform-origin: 50% 150px; }

  /* Health. Four pips: two headshots or four body shots. */
  #bc-hp { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%);
    display: flex; gap: 5px; }
  #bc-hp i { width: 26px; height: 4px; background: #eaeaea; opacity: .9;
    box-shadow: 0 0 3px rgba(0,0,0,.8); transition: background .2s, opacity .2s; }
  #bc-hp i.off { background: #6a2018; opacity: .45; }

  #bc-msg { position: absolute; left: 50%; bottom: 17%; transform: translateX(-50%);
    color: #f0f0f0; font-size: 14px; opacity: 0; transition: opacity .35s;
    text-shadow: 0 2px 6px #000; white-space: nowrap; }

  #bc-center { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; opacity: 0;
    transition: opacity 1.2s; color: #fff; }
  #bc-center b { font-size: 34px; letter-spacing: .22em; font-weight: 600; }
  #bc-center span { font-size: 13px; opacity: .6; letter-spacing: .14em; }

  /* Objective strip and phase banner */
  #bc-obj { position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; font-size: 12px; color: #e9e9e9;
    opacity: .85; text-shadow: 0 1px 3px #000; }
  #bc-obj-count:not(:empty) { background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.22);
    padding: 1px 7px; font-size: 11px; }
  #bc-banner { position: absolute; top: 33%; left: 50%; transform: translateX(-50%);
    font-size: 19px; letter-spacing: .16em; color: #fff; opacity: 0;
    transition: opacity .5s; text-shadow: 0 2px 10px #000; white-space: nowrap;
    text-align: center; max-width: 92vw; }

  /* ---- menus ---- */
  #ui { position: fixed; inset: 0; z-index: 30; display: none;
    background: radial-gradient(120% 90% at 50% 40%, #12161a 0%, #05070a 100%);
    color: #dfe3e2; overflow-y: auto; }
  #ui.on { display: block; }
  #ui .screen { display: none; min-height: 100%; align-items: center; justify-content: center;
    padding: 32px 16px; }
  #ui .screen.on { display: flex; }
  #ui .panel { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 22px; }
  #ui h1 { font-size: 30px; letter-spacing: .34em; font-weight: 600; text-transform: uppercase; }
  #ui h2 { font-size: 20px; letter-spacing: .24em; font-weight: 600; text-transform: uppercase; }
  #ui .sub { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; opacity: .45;
    margin-top: -14px; }
  #ui .hint { font-size: 11.5px; line-height: 1.7; opacity: .42; }

  #ui .rows { display: flex; flex-direction: column; gap: 12px; }
  #ui .row { display: grid; grid-template-columns: 1fr auto; align-items: center;
    gap: 6px 14px; font-size: 12.5px; }
  #ui .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: #6f9c6a;
    height: 18px; }
  #ui .lbl { letter-spacing: .1em; text-transform: uppercase; font-size: 11px; opacity: .72; }
  #ui output { font-size: 11px; opacity: .5; text-align: right; }
  #ui .choice { gap: 8px; }
  #ui .choice .opts { display: flex; gap: 8px; flex-wrap: wrap; }

  #ui button { font: inherit; font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
    color: #dfe3e2; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.16);
    padding: 12px 20px; cursor: pointer; transition: background .15s, border-color .15s; }
  #ui button:hover { background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.32); }
  #ui button:focus-visible { outline: 2px solid #6f9c6a; outline-offset: 2px; }
  #ui button.primary { background: #3f5c3c; border-color: #6f9c6a; }
  #ui button.primary:hover { background: #4d6f49; }
  #ui .chip { padding: 7px 14px; font-size: 11px; }
  #ui .chip.on { background: #3f5c3c; border-color: #6f9c6a; }
  #ui .acts { display: flex; gap: 10px; flex-wrap: wrap; }
  #ui .acts.col { flex-direction: column; }
  #ui .acts button { flex: 1 1 auto; }

  #ui .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  #ui .stats .grade { grid-column: 1 / -1; border-color: rgba(111,156,106,.5);
    background: rgba(111,156,106,.08); }
  #ui .stats .grade b { font-size: 44px; letter-spacing: .04em; }
  #ui .stats div { border: 1px solid rgba(255,255,255,.12); padding: 14px;
    display: flex; flex-direction: column; gap: 4px; }
  #ui .stats b { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #ui .stats span { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .45; }
</style>
</head>

<canvas id="game"></canvas>
