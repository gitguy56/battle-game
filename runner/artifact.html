<title>Chainrunner</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1418; }
  body { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  #game { display: block; width: 100%; height: 100%; cursor: crosshair; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10;
         transition: opacity .25s; letter-spacing: .04em; }

  #r-timer { position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums;
    color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.65); }

  #r-pace { position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .26em; opacity: .9; }
  #r-pace.gold { color: #ffd764; } #r-pace.silver { color: #cfd8e0; }

  #r-chain { position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: baseline; gap: 2px; opacity: 0; transition: opacity .18s;
    color: #ffd764; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
  #r-chain .x { font-size: 15px; opacity: .65; }
  #r-chain b { font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #r-chain i { position: absolute; left: 0; right: 0; bottom: -7px; height: 3px;
    background: currentColor; transform-origin: left center; opacity: .8; }
  #r-chain.hot { color: #ff8a5c; }

  #r-cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #r-cross s { position: absolute; background: #fff; opacity: .55; text-decoration: none;
    transition: all .1s ease-out; box-shadow: 0 0 3px rgba(0,0,0,.8); }
  #r-cross s:nth-child(1) { width: 2px; height: 7px; left: -1px; bottom: 6px; }
  #r-cross s:nth-child(2) { width: 2px; height: 7px; left: -1px; top: 6px; }
  #r-cross s:nth-child(3) { width: 7px; height: 2px; top: -1px; right: 6px; }
  #r-cross s:nth-child(4) { width: 7px; height: 2px; top: -1px; left: 6px; }
  #r-cross.on s { background: #ffd764; opacity: 1; }
  #r-cross.on s:nth-child(1) { bottom: 11px; } #r-cross.on s:nth-child(2) { top: 11px; }
  #r-cross.on s:nth-child(3) { right: 11px; }  #r-cross.on s:nth-child(4) { left: 11px; }

  #r-speed { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    display: flex; align-items: baseline; gap: 6px; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  #r-speed b { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1;
    transition: font-size .12s, color .12s; }
  #r-speed span { font-size: 11px; opacity: .45; letter-spacing: .2em; color: #fff; }

  #r-msg { position: absolute; left: 50%; top: 58%; transform: translateX(-50%);
    font-size: 17px; letter-spacing: .2em; color: #fff; opacity: 0; transition: opacity .3s;
    text-shadow: 0 2px 10px rgba(0,0,0,.8); text-transform: uppercase; }

  /* ---- menus ---- */
  #ui { position: fixed; inset: 0; z-index: 20; display: none; overflow-y: auto;
    background: radial-gradient(120% 90% at 50% 35%, #16323f 0%, #080f13 100%);
    color: #e6edf2; }
  #ui.on { display: block; }
  #ui .screen { display: none; min-height: 100%; align-items: center; justify-content: center;
    padding: 32px 16px; }
  #ui .screen.on { display: flex; }
  #ui .panel { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 20px; }
  #ui h1 { font-size: 32px; letter-spacing: .26em; font-weight: 700; text-transform: uppercase; }
  #ui h2 { font-size: 40px; font-variant-numeric: tabular-nums; font-weight: 700; }
  #ui .sub { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; opacity: .45;
    margin-top: -12px; }
  #ui .hint, #ui .best { font-size: 11.5px; line-height: 1.8; opacity: .5; }
  #ui .best b { opacity: 1; font-variant-numeric: tabular-nums; }

  #ui .how { display: flex; flex-direction: column; gap: 7px; }
  #ui .how div { display: flex; align-items: baseline; gap: 12px; font-size: 12px; }
  #ui .how b { min-width: 104px; color: #7fd0c8; font-weight: 600; }
  #ui .how span { opacity: .55; }

  #ui button { font: inherit; font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    color: #e6edf2; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18);
    padding: 13px 22px; cursor: pointer; transition: background .15s, border-color .15s; }
  #ui button:hover { background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.4); }
  #ui button:focus-visible { outline: 2px solid #7fd0c8; outline-offset: 2px; }
  #ui button.primary { background: #1e6a62; border-color: #7fd0c8; }
  #ui button.primary:hover { background: #2a8479; }
  #ui .acts { display: flex; gap: 10px; }
  #ui .acts button { flex: 1 1 auto; }

  #ui .medal { font-size: 13px; letter-spacing: .3em; font-weight: 700; }
  #ui .medal.gold { color: #ffd764; } #ui .medal.silver { color: #cfd8e0; }
  #ui .medal.bronze { color: #d69a63; } #ui .medal.none { color: #8fa3ae; }

  #ui .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  #ui .stats div { border: 1px solid rgba(255,255,255,.12); padding: 13px;
    display: flex; flex-direction: column; gap: 3px; }
  #ui .stats .wide { grid-column: 1 / -1; }
  #ui .stats b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #ui .stats span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .45; }
</style>

<canvas id="game"></canvas>
<div id="hud"></div>
<div id="ui"></div>
